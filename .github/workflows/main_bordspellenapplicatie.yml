name: Build and deploy ASP.NET Core app to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore ./BordspellenApplicatie/BordspellenApplicatie.csproj

      - name: Build application
        run: dotnet build ./BordspellenApplicatie/BordspellenApplicatie.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish ./BordspellenApplicatie/BordspellenApplicatie.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C959BBFC7D28416AAF37EB1149E7422C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AB44D9742A7743E08C746865A8F96C49 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9C9B79F462CA4D45BF73644039F9F2EB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'BordspellenApplicatie'
          slot-name: 'Production'
          package: ./publish